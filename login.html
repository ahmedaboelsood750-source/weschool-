<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مدرسة WE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="home.html" class="logo">
                    <i class="fa-solid fa-graduation-cap"></i> WE <span>School</span>
                </a>
                <h2>login </h2>
                <p>بوابة الطلاب وأولياء الأمور والكادر التعليمي</p>
            </div>

            <form class="login-form">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i>username / email</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم أو البريد" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> password</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> تذكرني
                    </label>
                    <a href="#" class="forgot-pass">forget password?</a>
                </div>

                <button type="submit" class="btn btn-primary login-btn">دخول الصفحة الشخصية</button>
            </form>

            <div class="login-footer">
                <p>ليس لديك حساب؟ <a href="admission.html">التقديم للمدرسة</a></p>
                
                <a href="home.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
                
            </div>
        </div>
    </div>
<p>dont have an account <a href="register.html">register</a></p>
</body>
</html>
